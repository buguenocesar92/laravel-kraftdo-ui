name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pint + Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Formato (Pint)
        run: vendor/bin/pint --test
      - name: Tests (Pest)
        run: vendor/bin/pest
      - name: Auditoría de dependencias (composer audit)
        # Bloqueante: un CVE conocido en una dependencia no puede entrar a
        # main sin que nadie lo vea. --no-dev porque lo que se publica y
        # consumen los 4 sistemas es el código de producción, no las
        # herramientas de desarrollo del propio paquete.
        run: composer audit --no-dev

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sin el historial completo, `gitleaks git` no ve nada

      # Binario oficial en vez del action: el action de gitleaks pide licencia
      # para organizaciones, y así la versión queda fijada y a la vista.
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Buscar credenciales en el árbol de trabajo
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Buscar credenciales en el historial
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml
